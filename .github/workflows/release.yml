name: Build and release jars

# Builds the pure-Java main jar and one `natives-<triple>` classifier jar per
# supported platform (com/opendaq/natives/<triple>/ with an index.txt file list
# and a tag.txt cache key), and publishes them all as assets on a GitHub
# release.  The bindings load the natives from whichever
# `jopendaq-<version>-natives-<triple>.jar` is on the classpath -- there is no
# runtime download.
#
# Nothing here builds openDAQ.  The native libraries are the ones of the
# opendaq-bindings-nightly release pinned in opendaq-nightly.lock, the same
# release whose API spec the checked-in bindings were generated from; they are
# downloaded, verified against the release's manifest, and repackaged as jars.

'on':
  workflow_dispatch:
    inputs:
      version:
        description: "Release version for the jars/tag (default: pom project.version)."
        required: false
        type: string

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve version and pinned nightly
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      nightly: ${{ steps.resolve.outputs.nightly }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          [ -z "$version" ] && version="$(grep -m1 '<version>' pom.xml | sed -E 's|.*<version>(.*)</version>.*|\1|')"
          version="${version%-SNAPSHOT}"   # a release is never a snapshot
          nightly="$(python3 -c "import json; print(json.load(open('opendaq-nightly.lock'))['tag'])")"
          {
            echo "version=$version"
            echo "nightly=$nightly"
          } >> "$GITHUB_OUTPUT"

  # The checked-in bindings must be exactly what the pinned spec generates;
  # otherwise the jar would not match the natives it ships with.  A mismatch
  # means someone bumped the lock without regenerating (`make bump-nightly`).
  bindings:
    name: Verify bindings match the pinned spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and compare
        shell: bash
        run: |
          make bindings
          if [ -n "$(git status --porcelain -- src/generated/java)" ]; then
            git status --short -- src/generated/java | head -n 40
            echo "::error::src/generated/java does not match opendaq-nightly.lock -- run 'make bump-nightly TAG=<tag>' and commit the result." >&2
            exit 1
          fi

  main-jar:
    name: Build main jar
    runs-on: ubuntu-latest
    needs: [resolve, bindings]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
      - name: Set project version
        shell: bash
        run: mvn -q -B versions:set -DnewVersion="${{ needs.resolve.outputs.version }}" -DgenerateBackupPoms=false
      - name: Package (pure Java, no natives needed)
        shell: bash
        run: mvn -q -B -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: main-jar
          path: target/jopendaq-${{ needs.resolve.outputs.version }}.jar
          if-no-files-found: error

  # The jars only repackage prebuilt libraries, so all platforms are produced
  # on one runner.
  natives-jars:
    name: Package natives jars
    runs-on: ubuntu-latest
    needs: [resolve, bindings]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the pinned natives
        shell: bash
        run: python3 tools/fetch_nightly.py --natives all

      - name: Package one jar per platform
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          NIGHTLY: ${{ needs.resolve.outputs.nightly }}
        run: |
          mkdir -p dist
          # Maven os classifier <- nightly platform name
          for pair in linux-x86_64:linux-x64 osx-aarch_64:darwin-arm64 windows-x86_64:windows-x64; do
            triple="${pair%%:*}"
            source="tmp/nightly/$NIGHTLY/natives/${pair##*:}"
            if [ ! -d "$source" ]; then
              echo "::error::nightly $NIGHTLY has no natives for ${pair##*:}" >&2
              exit 1
            fi

            stage="stage/$triple/com/opendaq/natives/$triple"
            mkdir -p "$stage"
            cp "$source"/* "$stage/"
            ls -1 "$source" | sort > "$stage/index.txt"
            # Cache key: the release these libraries came from.
            printf '%s\n' "$NIGHTLY" > "$stage/tag.txt"

            # Sanity: the core libraries must be present.
            for stem in daqcoretypes daqcoreobjects opendaq copendaq; do
              if ! ls "$stage" | grep -q "$stem"; then
                echo "::error::missing a library matching *$stem* for $triple" >&2
                exit 1
              fi
            done

            jar --create --file "dist/jopendaq-$VERSION-natives-$triple.jar" -C "stage/$triple" .
            echo "$triple:"; sed 's/^/  /' "$stage/index.txt"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: natives-jars
          path: dist/*.jar
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [resolve, main-jar, natives-jars]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List assets
        shell: bash
        run: find dist -type f | sort
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          NIGHTLY: ${{ needs.resolve.outputs.nightly }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi
          gh release create "$tag" \
            --title "jopendaq $VERSION" \
            --notes "openDAQ Java bindings $VERSION, generated from and shipping the native libraries of openDAQ bindings nightly \`$NIGHTLY\`.

          Add the \`jopendaq-$VERSION.jar\` plus the \`jopendaq-$VERSION-natives-<platform>.jar\` for your OS to the classpath." \
            dist/jopendaq-*.jar
