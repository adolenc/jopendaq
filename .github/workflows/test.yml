name: Tests

# Runs the JUnit suite on every push and pull request.  Most of the suite drives
# the real native openDAQ runtime -- the reference-device simulator
# (daqref://device0), the stream readers, and the core type/object bindings --
# so CI needs the native libraries present.  It downloads the ones of the
# opendaq-bindings-nightly release pinned in opendaq-nightly.lock (the release
# the checked-in bindings were generated from) into bin/linux-x86_64/, points
# the loader at them via OPENDAQ_JAVA_NATIVE_DIR, and runs `mvn test` --
# mirroring `make natives test`.

'on':
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Where the loader picks up the natives (bin/<triple>/), via OPENDAQ_JAVA_NATIVE_DIR.
  NATIVES_DIR: bin/linux-x86_64

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Core libs + the reference device/function-block modules the simulator
      # tests need, verified against the checksums of the release's manifest.
      - name: Download the pinned openDAQ natives
        shell: bash
        run: |
          spec="$(python3 tools/fetch_nightly.py --natives linux-x64)"
          mkdir -p "$NATIVES_DIR"
          cp "$(dirname "$spec")"/natives/linux-x64/* "$NATIVES_DIR/"
          ls -1 "$NATIVES_DIR"

          # Sanity: the core libraries must be present.
          for stem in daqcoretypes daqcoreobjects opendaq copendaq; do
            if ! ls "$NATIVES_DIR" | grep -q "$stem"; then
              echo "The nightly is missing a library matching *$stem*." >&2
              exit 1
            fi
          done

      # Point the loader at the natives (as `make test` does) and run the suite.
      # --enable-native-access is already set on surefire's argLine.
      - name: Run tests
        shell: bash
        env:
          OPENDAQ_JAVA_NATIVE_DIR: ${{ github.workspace }}/${{ env.NATIVES_DIR }}
        run: mvn -B test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
